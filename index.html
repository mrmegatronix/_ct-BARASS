<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Assistant — _ct-BARASS</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- PIN-Coded Access Gate (pin-coded-access standard) -->
    <div id="pinGate" class="pin-gate hidden" aria-label="PIN Access Screen">
        <div class="pin-gate-card">
            <img src="assets/logo.svg" alt="Bar Assistant" class="pin-gate-logo">
            <h1 class="pin-gate-title">Bar Assistant</h1>
            <p class="pin-gate-sub">Enter 4-digit access PIN to unlock Coasters Tavern</p>
            <div id="pinOtpContainer"></div>
            <button type="button" id="btnPinClear" class="btn btn-ghost btn-sm" style="margin-top:10px;">Clear</button>
        </div>
    </div>

    <div id="app" class="app-shell">
        <!-- Top Header -->
        <header class="topbar">
            <div class="topbar-left">
                <a href="#dashboard" class="brand" data-nav="dashboard">
                    <img src="assets/logo.svg" alt="Bar Assistant" class="brand-logo">
                    <div class="brand-text">
                        <span class="brand-title">Bar Assistant</span>
                        <span class="brand-sub">_ct-BARASS</span>
                    </div>
                </a>
                <div class="bar-selector-wrap">
                    <label for="barSelect" class="sr-only">Active Bar</label>
                    <select id="barSelect" class="bar-select" title="Switch Active Bar"></select>
                    <button id="btnManageBars" class="btn btn-icon btn-ghost" title="Manage Bars">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                </div>
            </div>

            <div class="topbar-center">
                <div class="global-search-wrap">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="search" id="globalSearch" class="global-search" placeholder="Search cocktails, ingredients, Coasters Tavern products... (Press /)" autocomplete="off">
                </div>
            </div>

            <div class="topbar-right">
                <div class="unit-toggle" role="group" aria-label="Measurement Units">
                    <button type="button" class="unit-btn active" data-unit="ml">ml</button>
                    <button type="button" class="unit-btn" data-unit="oz">oz</button>
                    <button type="button" class="unit-btn" data-unit="cl">cl</button>
                </div>

                <div class="header-clock" id="headerClock" aria-label="Current Time">
                    <span id="clockHours">00</span><span class="clock-colon">:</span><span id="clockMinutes">00</span><span class="clock-colon">:</span><span id="clockSeconds">00</span>
                </div>

                <button id="btnQrShare" class="btn btn-secondary btn-sm" title="Open on Another Device (QR Code)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM17 17h4v4h-4zM14 20h3"/></svg>
                    <span>QR</span>
                </button>

                <button id="btnBackup" class="btn btn-secondary btn-sm" title="Export / Import Bar Data">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    <span>Backup</span>
                </button>

                <button id="btnLockApp" class="btn btn-ghost btn-sm" title="Lock Session">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Body -->
        <div class="app-body">
            <!-- Sidebar Navigation -->
            <aside class="sidebar" id="sidebar">
                <nav class="nav-list">
                    <button class="nav-item active" data-view="dashboard">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                        <span>Dashboard</span>
                    </button>
                    <button class="nav-item" data-view="cocktails">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 22h8M12 11v11M19 3H5l7 8Z"/></svg>
                        <span>Cocktails</span>
                        <span class="nav-badge" id="badgeCocktails">0</span>
                    </button>
                    <button class="nav-item" data-view="shelf">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18M7 6v12M17 6v12"/></svg>
                        <span>My Shelf</span>
                        <span class="nav-badge accent" id="badgeShelf">0</span>
                    </button>
                    <button class="nav-item" data-view="ingredients">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 2v7.31M14 9.3V2M8.5 2h7M14 9.3a6.5 6.5 0 1 1-4 0"/></svg>
                        <span>Ingredients</span>
                        <span class="nav-badge" id="badgeIngredients">0</span>
                    </button>
                    <button class="nav-item" data-view="products">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        <span>Product List</span>
                        <span class="nav-badge" id="badgeProducts">0</span>
                    </button>
                    <button class="nav-item" data-view="shopping">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                        <span>Shopping List</span>
                        <span class="nav-badge" id="badgeShopping">0</span>
                    </button>
                    <button class="nav-item" data-view="collections">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                        <span>Collections &amp; Menu</span>
                    </button>
                    <button class="nav-item" data-view="listmaker">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                        <span>List &amp; Print Maker</span>
                    </button>
                    <button class="nav-item" data-view="calculators">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8" y2="10"/><line x1="12" y1="10" x2="12" y2="10"/><line x1="16" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="8" y2="14"/><line x1="12" y1="14" x2="12" y2="14"/><line x1="16" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="18" x2="16" y2="18"/></svg>
                        <span>Calculators</span>
                    </button>
                    <button class="nav-item" data-view="reference">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                        <span>Bar Reference</span>
                    </button>
                </nav>

                <div class="sidebar-footer">
                    <div class="shelf-summary-card">
                        <div class="shelf-summary-label">Makeable Now</div>
                        <div class="shelf-summary-val" id="sidebarMakeableCount">0 cocktails</div>
                        <button class="btn btn-primary btn-xs btn-block" id="btnSurpriseMe">
                            Surprise Me
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content Viewport -->
            <main class="main-viewport" id="mainViewport">
                <div id="loadingState" class="loading-screen">
                    <div class="spinner"></div>
                    <p>Loading Bar Assistant dataset...</p>
                </div>
                <div id="viewContainer" class="view-container hidden"></div>
            </main>
        </div>
    </div>

    <!-- Modal Root -->
    <div id="modalRoot" class="modal-root hidden" role="dialog" aria-modal="true"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/qrcode.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
